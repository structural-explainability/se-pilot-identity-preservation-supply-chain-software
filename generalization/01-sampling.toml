# ------------------------------------------------------------
# Prohibited information
# ------------------------------------------------------------

[prohibited_information]

criteria = [
    "Transformation output.",
    "Evaluator output.",
    "Observed identity-preservation behavior.",
    "Known transformation-specific failure behavior.",
    "Whether a candidate appears likely to produce a violation.",
]


# ------------------------------------------------------------
# Unit of selection
# ------------------------------------------------------------
# A subject is the described primary component (name, version):
# CycloneDX metadata.component; SPDX the package referenced by
# documentDescribes or DESCRIBES. Where absent, the subject is the
# repository-relative parent directory. Documents sharing a subject
# are one unit.

[unit]

selection_unit = "source_standard + subject"
one_document_per_unit = "lowest source SHA-256 among eligible documents for the same source_standard and subject"

# ------------------------------------------------------------
# Selection
# ------------------------------------------------------------
# Census: every eligible subject is selected. No allocation
# decision remains after enumeration.

[selection]

method = "census-of-eligible-units"


# ------------------------------------------------------------
# Reporting dimensions
# ------------------------------------------------------------
# Used for reporting only; never for selection.

[reporting]

dimensions = ["source_standard", "source_spec_version", "package_ecosystem"]
package_ecosystem_rule = "PURL type with the most canonical source PURLs; ties broken lexically; 'mixed' recorded when the top type covers under half"


# ------------------------------------------------------------
# Candidate enumeration
# ------------------------------------------------------------

[candidate_enumeration]

record_all_screened_candidates = true
record_exclusion_reason = true
record_source_standard = true
record_source_spec_version = true
record_subject = true
record_package_ecosystem = true
record_sha256 = true
record_repository = true
record_repository_revision = true
record_repository_relative_path = true


# ------------------------------------------------------------
# Reproducibility
# ------------------------------------------------------------
# SHA-256 is computed over the git blob bytes at the fixed
# revision. Preserved copies are stored with -text in
# .gitattributes so line-ending normalization cannot alter them.

[reproducibility]

preserve_candidate_inventory = true
preserve_selected_sources = true
record_sha256 = true
record_repository_revision = true
record_repository_relative_path = true
screening_script_recorded = true


# ------------------------------------------------------------
# Selection boundary
# ------------------------------------------------------------
# Corpus selection is complete only after:
# 1. repository revisions are fixed,
# 2. validation exclusions are filled,
# 3. all candidates are enumerated and screened mechanically,
# 4. eligible subjects are resolved to one document each, and
# 5. selected membership is written to 03-corpus.toml.
#
# No generalization transformation may be executed or inspected
# before this process is complete.

[selection_boundary]

transform_before_selection_complete = false
inspect_transformation_output_before_selection_complete = false
inspect_evaluator_output_before_selection_complete = false
