# ============================================================
# 01-sampling.toml
# ============================================================
# Defines the predeclared sampling process used to construct the
# held-out generalization corpus.
#
# This file specifies:
# - the sampling frame,
# - source-only eligibility and exclusion criteria,
# - prohibited information during selection,
# - the unit of selection,
# - deterministic selection,
# - reporting dimensions, and
# - reproducibility requirements.
#
# This file MUST NOT contain transformation outputs, evaluator
# results, observed preservation behavior, or candidate-specific
# selection outcomes.
#
# Candidate screening outcomes are recorded in 02-candidates.toml.
# Selected corpus membership is recorded in 03-corpus.toml.
# Preserved source artifacts are recorded in 04-sources.toml.
# ============================================================

schema_version = 1
sampling_id = "generalization-corpus-v1"


# ------------------------------------------------------------
# Objective
# ------------------------------------------------------------

[objective]

description = """
Construct a reproducible held-out corpus of example software SBOMs
published by the CycloneDX and SPDX standards projects for
generalization evaluation of the frozen identity-preservation
commitment. Conclusions are scoped to this frame.
"""


# ------------------------------------------------------------
# Sampling frame
# ------------------------------------------------------------
# Revisions are fixed. Candidate enumeration is mechanical:
# every blob at the fixed revision whose path ends in ".json"
# is a screened candidate. Other serializations are out of scope
# because the frozen evaluator reads JSON only.

[sampling_frame]

repository_types = ["official-standard-example-repository"]

[[sampling_frame.repository]]
name = "CycloneDX/bom-examples"
url = "https://github.com/CycloneDX/bom-examples.git"
revision = "7d9172d00c88c05a8f1ccb90589d111870fc9d86"

[[sampling_frame.repository]]
name = "spdx/spdx-examples"
url = "https://github.com/spdx/spdx-examples.git"
revision = "2181917ef6ff74de89252ee785583c27a38d6199"

[sampling_frame.enumeration]

method = "git ls-tree -r --name-only <revision>"
path_filter = "*.json"
content_source = "git blob at fixed revision"

[sampling_frame.constraints]

publicly_accessible = true
fixed_repository_revision = true


# ------------------------------------------------------------
# Disclosure
# ------------------------------------------------------------

[disclosure]

prior_source_only_scan = """
Before this file was fixed, an aggregate source-only feasibility
scan was run at the revisions above: format/version counts and
counts of documents with at least one component carrying a
canonical PURL and a content-hash anchor, using the Freeze 01
source adapter on source documents only. No transformation was
executed and no evaluator comparison was run.
"""


# ------------------------------------------------------------
# In-scope formats
# ------------------------------------------------------------
# Grounded in Freeze 01 sources.toml. SPDX 3.0 is out of scope
# for this corpus: the Freeze 01 detect_format does not recognize
# SPDX 3.0.1 JSON-LD serialization (recorded as a known Freeze 01
# evaluator limitation in the Freeze 02 record).

[formats]

spdx_versions = ["SPDX-2.3"]
cyclonedx_spec_versions = ["1.2", "1.3", "1.4", "1.5", "1.6"]
serialization = "json"


# ------------------------------------------------------------
# Eligibility
# ------------------------------------------------------------
# Determined mechanically from the source document only, using the
# Freeze 01 source adapter (formats.load) applied to the source.

[eligibility]

source_information_only = true

inclusion_criteria = [
    "Document parses as JSON.",
    "Document is SPDX with spdxVersion exactly in [formats].spdx_versions, or CycloneDX with specVersion in [formats].cyclonedx_spec_versions.",
    "Freeze 01 formats.load on the source yields at least one component with at least one canonical PURL and at least one content-hash anchor.",
    "Document uses an in-scope source standard, specification version, and serialization declared in [formats].",
]

exclusion_criteria = [
    "Document SHA-256 appears in [validation_exclusions].sha256.",
    "Document subject matches a subject in [validation_exclusions].subjects.",
    "Document fails any inclusion criterion (reason recorded).",
]

# ------------------------------------------------------------
# Validation exclusions
