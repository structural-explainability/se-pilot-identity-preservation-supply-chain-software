sha256 = "969E75AB32BB499957298365C43896B6A2F204951D7EF9FA12DB9482AB7504E2"

# Issue-derived discovery information only.
# This immutable OCI digest identifies the container whose attestation is
# retrieved. The issue is not treated as the authority for the SBOM contents.
container_image = "gcr.io/distroless/static-debian12:debug-nonroot@sha256:3d0f463de06b7ddff27684ec3bfd0b54a425149d0f8685308b1fdf297b0265e9"

#===========================
[source.attestation]
#===========================

# Repository-chosen filename preserving the raw newline-delimited JSON
# emitted by `cosign download attestation`.
file = "validation/cyclonedx-cli-424/attestation.jsonl"

# Artifact-derived.
# Calculate from the exact committed attestation.jsonl bytes.
# Get-FileHash validation/cyclonedx-cli-424/attestation.jsonl -Algorithm SHA256
sha256 = "2C22B2E256DFE3B41468C0ADB0F576B9867FA074A0B42130CF123ADB303A6E2E"

# Execution-derived.
# Record when this attestation was retrieved.
retrieved_at = "2026-09-20"

# Execution-derived.
# Record the exact cosign version used for retrieval.
cosign_version = "v3.0.2"

# Protocol-recorded PowerShell acquisition command.
# Unlike the historical issue command, preserve the complete attestation
# before extracting the SPDX payload.
acquisition_command = """
cosign download attestation `
  --platform linux/amd64 `
  gcr.io/distroless/static-debian12:debug-nonroot@sha256:3d0f463de06b7ddff27684ec3bfd0b54a425149d0f8685308b1fdf297b0265e9 `
  > validation/cyclonedx-cli-424/attestation.jsonl
"""

# Protocol-recorded extraction command.
# Select the historical attestation whose decoded SPDX payload contains the
# Debian snapshot timestamp reported in issue #424, then extract that exact
# SPDX predicate into source.spdx.json.
extraction_command = """
$Matches = @(
  Get-Content validation/cyclonedx-cli-424/attestation.jsonl |
    ForEach-Object {
      $envelope = $_ | ConvertFrom-Json

      $statementText = [System.Text.Encoding]::UTF8.GetString(
        [System.Convert]::FromBase64String($envelope.payload)
      )

      if ($statementText -match "20250327T204130Z") {
        $statement = $statementText | ConvertFrom-Json
        $statement.predicate
      }
    }
)

$DistinctPredicates = @(
  $Matches |
    Sort-Object -Unique
)

if ($DistinctPredicates.Count -ne 1) {
  throw "Expected exactly one distinct historical SPDX predicate; found $($DistinctPredicates.Count)."
}

$spdx = $DistinctPredicates[0] | ConvertFrom-Json

$spdx |
  ConvertTo-Json -Depth 100 |
  Set-Content validation/cyclonedx-cli-424/source.spdx.json
"""

