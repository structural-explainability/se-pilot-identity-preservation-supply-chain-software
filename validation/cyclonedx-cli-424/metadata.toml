notes = """
The preserved SPDX source contains the expected tzdata PURL
pkg:deb/debian/tzdata@2025b-0+deb12u1?arch=all.

The cyclonedx-cli 0.31.0 known-bad transformation preserves that PURL in the
generated CycloneDX document as the property
spdx:external-reference:package-manager:purl rather than in the canonical
component.purl slot.

The frozen purl_preservation_v1 evaluator classifies the corresponding tzdata
component as VIOLATED_RELOCATED with the detail "purl is present in the target
but not in its canonical slot."

The observed verdict matches the predeclared expected verdict and reproduces
the historical behavior reported in cyclonedx-cli issue #424.

This result is engineering-validation evidence.
It is not held-out evidence of generalization.
"""
