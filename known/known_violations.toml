# Predeclared defect shapes for the Freeze 02 "rediscovered" class.
# Declared before Freeze 02.
# A confirmed held-out violation is rediscovered
# when its direction, verdict, and (where given) target_location match a
# shape below.
# Matching does not depend on converter, package, or anchor.

[[shape]]
id = "purl-to-cyclonedx-properties"
direction = "spdx_to_cyclonedx"
verdict = "VIOLATED_RELOCATED"
target_location = "component.properties[].value"
established_by = "validation/cyclonedx-cli-424"
reference = "cyclonedx-cli#424"

[[shape]]
id = "purl-absent-from-spdx-canonical-ref"
direction = "cyclonedx_to_spdx"
verdict = "VIOLATED_DROPPED"
established_by = "validation/cyclonedx-cli-reverse-sweep"
